<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Videos | Edit Simple Libraries</title><meta name="description" content="Browse royalty-free stock videos for lawyers and doctors by category."><meta name="theme-color" content="#f07f2e">
<link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://ddiwrhpaankvxnbjbbxl.supabase.co" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,400,0..1&display=block">
<link rel="stylesheet" href="css/site.css"></head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<header id="es-header" class="sticky top-0 z-50 w-full h-16 bg-primary"></header>
<main class="max-w-7xl mx-auto px-4 md:px-6 pt-8">
<nav id="crumbs" aria-label="Breadcrumb" class="text-sm text-on-surface-variant flex flex-wrap items-center gap-1 mb-6 min-h-[20px]"></nav>
<h1 id="title" class="text-3xl md:text-5xl font-bold tracking-tight">All Videos</h1>
<p id="blurb" class="mt-3 text-on-surface-variant max-w-2xl">Royalty-free stock videos for lawyers, doctors and professional practices.</p>
<div id="cattabs" class="mt-8 flex flex-wrap gap-2 min-h-[40px]"></div>
<div id="subtabs" class="mt-3 flex flex-wrap gap-2"></div>
<div class="mt-6 flex flex-col sm:flex-row gap-3">
<label class="flex-1 flex items-center gap-2 bg-white border border-outline-variant/70 rounded-xl px-4 focus-within:ring-2 focus-within:ring-primary"><span class="material-symbols-outlined text-on-surface-variant">search</span><input id="q" type="search" aria-label="Search videos" class="flex-1 py-3 bg-transparent border-0 focus:ring-0" placeholder="Search what's in the video, title or tags…"></label>
<select id="sort" aria-label="Sort" class="rounded-xl border-outline-variant/70 bg-white px-4 py-3 text-sm focus:ring-primary"><option value="rel">Best match</option><option value="new">Newest</option><option value="short">Shortest</option><option value="long">Longest</option><option value="az">A–Z</option></select>
<select id="res" aria-label="Resolution" class="rounded-xl border-outline-variant/70 bg-white px-4 py-3 text-sm focus:ring-primary"><option value="">Any resolution</option><option>4K</option><option>1080p</option><option>720p</option></select>
<select id="ori" aria-label="Orientation" class="rounded-xl border-outline-variant/70 bg-white px-4 py-3 text-sm focus:ring-primary"><option value="">Any orientation</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="square">Square</option></select></div>
<p id="count" class="mt-4 text-sm text-on-surface-variant min-h-[20px]" aria-live="polite"></p>
<div id="grid" class="mt-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
<div id="empty" class="hidden text-center py-20 text-on-surface-variant"><span class="material-symbols-outlined !text-5xl">videocam_off</span><p class="mt-2">No videos found. Try different words or another subcategory.</p></div>
<div class="text-center mt-10"><button id="more" class="hidden px-6 py-3 rounded-full border border-outline-variant font-semibold hover:border-primary hover:text-primary">Load more</button></div>
</main>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/layout.js"></script>
<script>
(()=>{
const P=new URLSearchParams(location.search);let cat=P.get('cat')||'',sub=P.get('sub')||'';const qi=document.getElementById('q');qi.value=P.get('q')||'';
const grid=document.getElementById('grid'),PAGE=24;let all=[],shown=PAGE,seq=0;
const pill=(on,href,t)=>`<a href="${href}" class="px-4 py-2 rounded-full text-sm font-medium border transition ${on?'bg-primary text-on-primary border-primary':'bg-white border-outline-variant/70 hover:border-primary hover:text-primary'}">${esEsc(t)}</a>`;
function head(){const c=ES.cat(cat);
 document.getElementById('cattabs').innerHTML=pill(!cat,'videos.html','All')+ES.CATS.map(x=>pill(cat===x.slug,'videos.html?cat='+x.slug,x.name)).join('');
 const st=document.getElementById('subtabs');st.innerHTML=c?pill(!sub,'videos.html?cat='+cat,'All '+c.name.replace(/^For /,''))+c.subs.map(([s,n])=>pill(sub===s,`videos.html?cat=${cat}&sub=${s}`,n)).join(''):'';
 st.querySelectorAll('a').forEach(a=>{a.classList.replace('py-2','py-1.5');a.classList.replace('text-sm','text-xs')});
 const sn=sub&&c?ES.subName(cat,sub):'';document.getElementById('title').textContent=sn||(c?c.name:'All Videos');
 if(c)document.getElementById('blurb').textContent=c.blurb;document.title=(sn||c?.name||'All Videos')+' | Edit Simple Libraries';
 document.getElementById('crumbs').innerHTML='<a href="index.html" class="hover:text-primary">Home</a>'+(c?` <span>/</span> <a href="videos.html?cat=${cat}" class="hover:text-primary">${esEsc(c.name)}</a>`:' <span>/</span> Videos')+(sn?` <span>/</span> <span class="text-on-surface">${esEsc(sn)}</span>`:'');}
async function load(){const my=++seq;grid.innerHTML=esSkel(6);document.getElementById('empty').classList.add('hidden');document.getElementById('count').textContent='';
 const q=qi.value.trim();const r=await ES.listVideos({category:cat||undefined,subcategory:sub||undefined,q:q||undefined});if(my!==seq)return;all=r;shown=PAGE;render();
 const u=new URL(location);q?u.searchParams.set('q',q):u.searchParams.delete('q');history.replaceState(null,'',u);}
function render(){const s=document.getElementById('sort').value,r=document.getElementById('res').value,o=document.getElementById('ori').value;
 let v=all.filter(x=>(!r||x.resolution===r)&&(!o||x.orientation===o));
 const cmp={new:(a,b)=>b.created_at.localeCompare(a.created_at),short:(a,b)=>a.duration_seconds-b.duration_seconds,long:(a,b)=>b.duration_seconds-a.duration_seconds,az:(a,b)=>a.title.localeCompare(b.title)}[s];if(cmp)v=[...v].sort(cmp);
 grid.innerHTML=v.slice(0,shown).map(esCard).join('');esHoverPlay(grid);
 document.getElementById('count').textContent=v.length+' video'+(v.length===1?'':'s')+(qi.value.trim()?` for “${qi.value.trim()}”`:'');
 document.getElementById('empty').classList.toggle('hidden',v.length>0);document.getElementById('more').classList.toggle('hidden',v.length<=shown);}
let t;qi.oninput=()=>{clearTimeout(t);t=setTimeout(load,300)};['sort','res','ori'].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById('more').onclick=()=>{shown+=PAGE;render()};
head();grid.innerHTML=esSkel(6);ES.ready.then(()=>{head();load()});
})();
</script></body></html>
