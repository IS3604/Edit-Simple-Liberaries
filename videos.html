<body class="bg-surface text-on-surface antialiased min-h-screen" style="font-family:Inter,sans-serif">
<main class="max-w-7xl mx-auto px-4 md:px-8 pt-8">
<nav id="crumbs" class="text-sm text-on-surface-variant flex items-center gap-1 mb-6"></nav>
<h1 id="title" class="text-3xl md:text-5xl font-bold tracking-tight" style="font-family:'Plus Jakarta Sans'">All Videos</h1>
<p id="blurb" class="mt-3 text-on-surface-variant max-w-2xl">Royalty-free stock videos for lawyers, doctors and professional practices.</p>
<div id="cattabs" class="mt-8 flex flex-wrap gap-2"></div>
<div id="subtabs" class="mt-3 flex flex-wrap gap-2"></div>
<div class="mt-6 flex flex-col sm:flex-row gap-3">
<div class="flex-1 flex items-center gap-2 bg-surface-container-lowest border border-outline-variant/60 rounded-xl px-4"><span class="material-symbols-outlined text-on-surface-variant">search</span><input id="q" class="flex-1 py-3 bg-transparent outline-none border-0 focus:ring-0" placeholder="Search in this category…"></div>
<select id="sort" class="rounded-xl border-outline-variant/60 bg-surface-container-lowest px-4 py-3 text-sm"><option value="new">Newest</option><option value="short">Shortest</option><option value="long">Longest</option><option value="az">A–Z</option></select>
<select id="res" class="rounded-xl border-outline-variant/60 bg-surface-container-lowest px-4 py-3 text-sm"><option value="">Any resolution</option><option>4K</option><option>1080p</option></select></div>
<p id="count" class="mt-4 text-sm text-on-surface-variant"></p>
<div id="grid" class="mt-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
<div id="empty" class="hidden text-center py-20 text-on-surface-variant"><span class="material-symbols-outlined text-5xl">videocam_off</span><p class="mt-2">No videos found. Try another search or subcategory.</p></div>
</main>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/layout.js"></script>
<script type="module">
await ES.ready;

const P=new URLSearchParams(location.search);let cat=P.get('cat')||'',sub=P.get('sub')||'';const qi=document.getElementById('q');qi.value=P.get('q')||'';
const pill=(on,href,t)=>`<a href="${href}" class="px-4 py-2 rounded-full text-sm font-medium border transition ${on?'bg-primary text-on-primary border-primary':'bg-surface-container-lowest border-outline-variant/60 hover:border-primary hover:text-primary'}">${t}</a>`;
function header(){const c=ES.cat(cat);
 document.getElementById('cattabs').innerHTML=pill(!cat,'videos.html','All')+ES.CATS.map(x=>pill(cat===x.slug,'videos.html?cat='+x.slug,x.name)).join('');
 document.getElementById('subtabs').innerHTML=c?pill(!sub,'videos.html?cat='+cat,'All '+c.name.replace('For ',''))+c.subs.map(([s,n])=>pill(sub===s,`videos.html?cat=${cat}&sub=${s}`,n)).join(''):'';
 document.getElementById('subtabs').querySelectorAll('a').forEach(a=>a.classList.add('text-xs','py-1.5'));
 const sn=sub&&c?ES.subName(cat,sub):'';document.getElementById('title').textContent=sn||(c?c.name:'All Videos');
 if(c)document.getElementById('blurb').textContent=c.blurb;document.title=(sn||c?.name||'All Videos')+' | Edit Simple Libraries';
 document.getElementById('crumbs').innerHTML='<a href="index.html" class="hover:text-primary">Home</a>'+(c?` <span>/</span> <a href="videos.html?cat=${cat}" class="hover:text-primary">${c.name}</a>`:' <span>/</span> Videos')+(sn?` <span>/</span> <span class="text-on-surface">${sn}</span>`:'');}
let all=[];
async function load(){all=await ES.listVideos({category:cat||undefined,subcategory:sub||undefined,q:qi.value.trim()||undefined});render()}
function render(){const s=document.getElementById('sort').value,r=document.getElementById('res').value;let v=all.filter(x=>!r||x.resolution===r);
 v=[...v].sort({new:(a,b)=>b.created_at.localeCompare(a.created_at),short:(a,b)=>a.duration_seconds-b.duration_seconds,long:(a,b)=>b.duration_seconds-a.duration_seconds,az:(a,b)=>a.title.localeCompare(b.title)}[s]);
 const g=document.getElementById('grid');g.innerHTML=v.map(esCard).join('');esHoverPlay(g);document.getElementById('count').textContent=v.length+' video'+(v.length===1?'':'s');document.getElementById('empty').classList.toggle('hidden',v.length>0)}
let t;qi.oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};document.getElementById('sort').onchange=render;document.getElementById('res').onchange=render;
header();load();
</script></body></html>
