<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><script>document.documentElement.classList.add("auth-wait")</script><style>html.auth-wait body>*:not(#es-login){visibility:hidden!important}html.auth-wait body::after{content:"";position:fixed;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #ffe4cc;border-top-color:#f07f2e;animation:awspin .7s linear infinite}@keyframes awspin{to{transform:rotate(360deg)}}html.auth-wait.login-open body::after{display:none}</style><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Simple Libraries — Stock Videos for Lawyers & Doctors</title><meta name="description" content="Royalty-free stock videos for lawyers, doctors and professional practices."><meta name="theme-color" content="#ffe4cc">
<link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://ddiwrhpaankvxnbjbbxl.supabase.co" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,400,0..1&display=block">
<link rel="stylesheet" href="css/site.css"></head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<header id="es-header" class="sticky top-0 z-50 w-full h-16 bg-primary-fixed border-b border-orange-200"></header>
<main>
<section class="border-b border-outline-variant/40 bg-surface-container-lowest">
<div class="max-w-4xl mx-auto px-4 pt-16 md:pt-20 pb-14 text-center">
<h1 class="text-4xl md:text-6xl font-bold tracking-tight leading-tight">Videos Made for<br><span class="text-primary">Lawyers &amp; Doctors.</span></h1>
<p class="mt-5 text-lg text-on-surface-variant">Ready-to-use footage for your practice's website, ads and social media.</p>
<form id="hero-search" role="search" class="mt-10 flex flex-col sm:flex-row gap-2 bg-white p-2 rounded-2xl shadow-lg border border-outline-variant/60">
<select name="cat" aria-label="Category" class="bg-surface-container-low rounded-xl px-4 py-3 text-sm font-medium border-0 focus:ring-primary"><option value="">All categories</option></select>
<input name="q" aria-label="Search" class="flex-1 px-4 py-3 bg-transparent border-0 focus:ring-0" placeholder="Search by title or keyword…">
<button class="bg-primary text-on-primary px-6 py-3 rounded-xl font-semibold flex items-center justify-center gap-2 hover:brightness-95">Search<span class="material-symbols-outlined !text-lg">arrow_forward</span></button></form>
</div></section>
<section class="max-w-7xl mx-auto px-4 md:px-6 mt-14">
<h2 class="text-2xl md:text-3xl font-bold mb-2">Browse by Category</h2>
<p class="text-on-surface-variant mb-8">Pick your profession, then narrow down by subcategory.</p>
<div id="cats" class="grid gap-6 md:grid-cols-3"></div></section>
<section class="max-w-7xl mx-auto px-4 md:px-6 mt-20">
<div class="flex items-end justify-between mb-6"><div><h2 class="text-2xl md:text-3xl font-bold">Latest Videos</h2><p class="text-on-surface-variant">Freshly added to the library.</p></div><a href="videos.html" class="text-primary font-semibold text-sm flex items-center">View all<span class="material-symbols-outlined">chevron_right</span></a></div>
<div id="latest" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div></section>
</main>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/layout.js"></script>
<script>
(()=>{
const f=document.getElementById('hero-search'),cats=document.getElementById('cats'),latest=document.getElementById('latest');
latest.innerHTML=esSkel(6);
const catSkel=`<div class="rounded-3xl bg-surface-container-lowest border border-outline-variant/40 p-6"><div class="sk h-12 w-12 mb-4"></div><div class="sk h-5 w-1/2 mb-2"></div><div class="sk h-3 w-full mb-1"></div><div class="sk h-3 w-2/3 mb-4"></div><div class="flex gap-2"><div class="sk h-6 w-20"></div><div class="sk h-6 w-24"></div><div class="sk h-6 w-16"></div></div></div>`;
cats.innerHTML=catSkel.repeat(3);
f.onsubmit=e=>{e.preventDefault();const p=new URLSearchParams();if(f.cat.value)p.set('cat',f.cat.value);if(f.q.value.trim())p.set('q',f.q.value.trim());location.href='videos.html?'+p};
const render=async()=>{
 f.cat.innerHTML='<option value="">All categories</option>'+ES.CATS.map(c=>`<option value="${c.slug}">${esEsc(c.name)}</option>`).join('');
 const [n,vids]=await Promise.all([ES.counts(),ES.listVideos({limit:6})]);
 cats.innerHTML=ES.CATS.map(c=>`<div class="rounded-3xl bg-surface-container-lowest border border-outline-variant/40 p-6 hover:shadow-xl hover:border-primary/40 transition">
 <a href="videos.html?cat=${c.slug}" class="flex items-center justify-between mb-4"><span class="w-12 h-12 rounded-2xl bg-primary-fixed text-primary grid place-items-center"><span class="material-symbols-outlined">${c.icon}</span></span><span class="text-xs font-semibold text-on-surface-variant">${n[c.slug]||0} videos</span></a>
 <a href="videos.html?cat=${c.slug}"><h3 class="text-xl font-bold hover:text-primary">${esEsc(c.name)}</h3></a><p class="text-sm text-on-surface-variant mt-1 mb-4">${esEsc(c.blurb)}</p>
 <div class="flex flex-wrap gap-2">${c.subs.map(([s,nm])=>`<a href="videos.html?cat=${c.slug}&sub=${s}" class="text-xs px-3 py-1.5 rounded-full bg-surface-container hover:bg-primary hover:text-on-primary transition">${esEsc(nm)}</a>`).join('')}</div></div>`).join('');
 latest.innerHTML=vids.length?vids.map(esCard).join(''):'<p class="col-span-full text-center text-on-surface-variant py-12">New videos coming soon.</p>';esHoverPlay(latest);
};
ES.ready.then(render);ES.onChange(render);
})();
</script></body></html>
