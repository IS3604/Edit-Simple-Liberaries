<body class="bg-surface text-on-surface antialiased min-h-screen" style="font-family:Inter,sans-serif">
<main>
<section class="relative overflow-hidden">
<div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-primary/15 blur-[120px] rounded-full"></div>
<div class="relative max-w-4xl mx-auto px-4 pt-20 pb-16 text-center">
<span class="inline-flex items-center gap-2 bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full text-xs font-semibold mb-6"><span class="material-symbols-outlined text-sm">movie</span>Stock videos for professionals</span>
<h1 class="text-4xl md:text-6xl font-bold tracking-tight leading-tight" style="font-family:'Plus Jakarta Sans'">Videos Made for<br><span class="text-primary">Lawyers &amp; Doctors.</span></h1>
<p class="mt-5 text-lg text-on-surface-variant">Ready-to-use footage for your practice's website, ads and social media.</p>
<form id="hero-search" class="mt-10 flex flex-col sm:flex-row gap-2 bg-surface-container-lowest p-2 rounded-2xl shadow-lg border border-outline-variant/50">
<select name="cat" class="bg-surface-container-low rounded-xl px-4 py-3 text-sm font-medium border-0"><option value="">All categories</option></select>
<input name="q" class="flex-1 px-4 py-3 bg-transparent outline-none border-0 focus:ring-0" placeholder="Search courtroom, surgery, handshake…">
<button class="bg-primary text-on-primary px-6 py-3 rounded-xl font-semibold flex items-center justify-center gap-2 hover:opacity-90">Search<span class="material-symbols-outlined text-lg">arrow_forward</span></button></form>
<div id="trending" class="mt-5 flex flex-wrap justify-center gap-2 text-sm"></div></div></section>
<section class="max-w-7xl mx-auto px-4 md:px-8 mt-8">
<h2 class="text-2xl md:text-3xl font-bold mb-2" style="font-family:'Plus Jakarta Sans'">Browse by Category</h2>
<p class="text-on-surface-variant mb-8">Pick your profession, then narrow down by subcategory.</p>
<div id="cats" class="grid gap-6 md:grid-cols-3"></div></section>
<section class="max-w-7xl mx-auto px-4 md:px-8 mt-20">
<div class="flex items-end justify-between mb-6"><div><h2 class="text-2xl md:text-3xl font-bold" style="font-family:'Plus Jakarta Sans'">Latest Videos</h2><p class="text-on-surface-variant">Freshly added to the library.</p></div><a href="videos.html" class="text-primary font-semibold text-sm flex items-center">View all<span class="material-symbols-outlined">chevron_right</span></a></div>
<div id="latest" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div></section>
</main>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/layout.js"></script>
<script type="module">
await ES.ready;

const f=document.getElementById('hero-search');
ES.CATS.forEach(c=>f.cat.insertAdjacentHTML('beforeend',`<option value="${c.slug}">${c.name}</option>`));
f.onsubmit=e=>{e.preventDefault();const p=new URLSearchParams();if(f.cat.value)p.set('cat',f.cat.value);if(f.q.value)p.set('q',f.q.value);location.href='videos.html?'+p};
['Courtroom','Consultation','Hospital','Surgery','Handshake','Testimonials'].forEach(t=>document.getElementById('trending').insertAdjacentHTML('beforeend',`<a href="videos.html?q=${t}" class="px-3 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/60 hover:border-primary hover:text-primary">${t}</a>`));
(async()=>{
 document.getElementById('cats').innerHTML=(await Promise.all(ES.CATS.map(async c=>`<div class="rounded-3xl bg-surface-container-lowest border border-outline-variant/40 p-6 hover:shadow-xl transition">
 <a href="videos.html?cat=${c.slug}" class="flex items-center justify-between mb-3"><span class="w-12 h-12 rounded-2xl bg-primary-fixed text-primary flex items-center justify-center"><span class="material-symbols-outlined">${c.icon}</span></span><span class="text-xs font-semibold text-on-surface-variant">${await ES.countVideos(c.slug)} videos</span></a>
 <a href="videos.html?cat=${c.slug}"><h3 class="text-xl font-bold hover:text-primary" style="font-family:'Plus Jakarta Sans'">${c.name}</h3></a><p class="text-sm text-on-surface-variant mt-1 mb-4">${c.blurb}</p>
 <div class="flex flex-wrap gap-2">${c.subs.map(([s,n])=>`<a href="videos.html?cat=${c.slug}&sub=${s}" class="text-xs px-3 py-1.5 rounded-full bg-surface-container hover:bg-primary hover:text-on-primary transition">${n}</a>`).join('')}</div></div>`))).join('');
 const l=document.getElementById('latest');l.innerHTML=(await ES.listVideos()).slice(0,6).map(esCard).join('');esHoverPlay(l);
})();
</script></body></html>
