<!DOCTYPE html>

<html lang="en"><head><title>Video | Edit Simple Libraries</title><link rel="icon" href="logo.png"><link rel="icon" href="logo.png"><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"secondary-container":"#fdba74","primary":"#f07f2e","outline":"#8a7a6d","primary-fixed":"#ffe4cc","on-primary-fixed":"#3d1a00","inverse-surface":"#3a2e26","on-primary":"#ffffff","on-surface-variant":"#57493f","secondary-fixed-dim":"#fdc79a","primary-container":"#fb923c","inverse-primary":"#fdc79a","on-surface":"#2a1f17","on-background":"#2a1f17","outline-variant":"#e5d6c8","surface-container-lowest":"#ffffff","on-error-container":"#93000a","on-secondary":"#ffffff","tertiary-fixed":"#ffdbcc","error-container":"#ffdad6","secondary":"#f59e5b","surface":"#fffaf5","surface-container-high":"#ffe9d6","on-error":"#ffffff","inverse-on-surface":"#fff1e6","on-secondary-fixed-variant":"#c2570c","tertiary-container":"#a44100","tertiary":"#7e3000","on-primary-fixed-variant":"#c2570c","surface-tint":"#f07f2e","background":"#fffaf5","secondary-fixed":"#ffe4cc","surface-container-highest":"#fde0c7","error":"#ba1a1a","surface-dim":"#f3dcc8","on-secondary-fixed":"#3d1a00","surface-bright":"#fffaf5","surface-container-low":"#fff5ec","on-secondary-container":"#fffaf5","on-primary-container":"#fff1e6","primary-fixed-dim":"#fdc79a","on-tertiary":"#ffffff","surface-variant":"#fde0c7","tertiary-fixed-dim":"#ffb695","on-tertiary-fixed":"#351000","on-tertiary-fixed-variant":"#7b2f00","surface-container":"#ffeede","on-tertiary-container":"#ffd2be"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"margin-mobile":"1rem","gutter-mobile":"0.75rem","space-xl":"2.5rem","margin":"2rem","space-xs":"0.25rem","space-md":"1rem","space-sm":"0.5rem","space-lg":"1.5rem","gutter":"1.25rem"},"fontFamily":{"body-lg":["Inter"],"label-xs":["Inter"],"headline-xl-mobile":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"label-md":["Inter"],"body-md":["Inter"],"headline-md":["Plus Jakarta Sans"],"label-sm":["Inter"],"headline-xl":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"body-sm":["Inter"]},"fontSize":{"body-lg":["18px",{"lineHeight":"28px","letterSpacing":"-0.005em","fontWeight":"400"}],"label-xs":["10px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"headline-xl-mobile":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"600"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"body-md":["15px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"label-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"headline-xl":["48px",{"lineHeight":"56px","letterSpacing":"-0.025em","fontWeight":"700"}],"headline-sm":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-lg-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.015em","fontWeight":"600"}],"body-sm":["13px",{"lineHeight":"20px","letterSpacing":"0.005em","fontWeight":"400"}]}}}};</script></head>
<body class="bg-surface text-on-surface antialiased min-h-screen" style="font-family:Inter,sans-serif">
<main class="max-w-7xl mx-auto px-4 md:px-8 pt-8" id="root"><p class="text-on-surface-variant py-20 text-center">Loading…</p></main>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/layout.js"></script>
<script type="module">
await ES.ready;

(async()=>{const id=new URLSearchParams(location.search).get('id');const v=id&&await ES.getVideo(id);const root=document.getElementById('root');
if(!v){root.innerHTML='<div class="text-center py-24"><h1 class="text-2xl font-bold">Video not found</h1><a href="videos.html" class="text-primary font-semibold mt-4 inline-block">Browse all videos</a></div>';return}
const c=ES.cat(v.category),sn=ES.subName(v.category,v.subcategory);document.title=v.title+' | Edit Simple Libraries';
root.innerHTML=`<nav class="text-sm text-on-surface-variant flex flex-wrap items-center gap-1 mb-6"><a href="index.html" class="hover:text-primary">Home</a> / <a class="hover:text-primary" href="videos.html?cat=${v.category}">${c?.name}</a> / <a class="hover:text-primary" href="videos.html?cat=${v.category}&sub=${v.subcategory}">${sn}</a></nav>
<div class="grid lg:grid-cols-12 gap-8"><section class="lg:col-span-8">
<div class="rounded-2xl overflow-hidden bg-black aspect-video relative">${v.video_url?`<video controls playsinline poster="${v.thumbnail_url||''}" src="${v.video_url}" class="w-full h-full object-contain"></video>`:`<div class="absolute inset-0 bg-gradient-to-br from-orange-300 to-amber-600 flex flex-col items-center justify-center text-white"><span class="material-symbols-outlined text-7xl">${c?.icon||'movie'}</span><p class="mt-2 text-sm opacity-90">Preview available once connected to Supabase</p></div>`}</div>
<h1 class="mt-6 text-2xl md:text-4xl font-bold" style="font-family:'Plus Jakarta Sans'">${v.title}</h1>
<p class="mt-3 text-on-surface-variant">${v.description||''}</p>
<div class="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-3">${[['Resolution',v.resolution||'—'],['Frame rate',(v.fps||'—')+' fps'],['Duration',ES.dur(v.duration_seconds||0)],['Orientation',v.orientation||'horizontal']].map(([k,x])=>`<div class="rounded-xl bg-surface-container-lowest border border-outline-variant/40 p-4"><p class="text-xs text-on-surface-variant">${k}</p><p class="font-semibold capitalize">${x}</p></div>`).join('')}</div>
<div class="mt-6 flex flex-wrap gap-2">${(v.tags||[]).map(t=>`<a href="videos.html?q=${encodeURIComponent(t)}" class="text-xs px-3 py-1.5 rounded-full bg-surface-container hover:text-primary">#${t}</a>`).join('')}</div></section>
<aside class="lg:col-span-4"><div class="rounded-2xl bg-surface-container-lowest border border-outline-variant/40 p-6 lg:sticky lg:top-24">
<p class="text-xs font-semibold text-primary uppercase tracking-wide">${c?.name} · ${sn}</p><h2 class="text-lg font-bold mt-1">Download this clip</h2><p class="text-sm text-on-surface-variant mt-1 mb-5">Royalty-free for your practice's website, ads and social media.</p>
<button id="dl" class="w-full bg-primary text-on-primary rounded-xl py-3 font-semibold flex items-center justify-center gap-2 hover:opacity-90"><span class="material-symbols-outlined">download</span>Download</button>
<button id="share" class="w-full mt-3 border border-outline-variant rounded-xl py-3 font-medium flex items-center justify-center gap-2 hover:border-primary hover:text-primary"><span class="material-symbols-outlined">share</span>Copy link</button></div></aside></div>
<section class="mt-16"><h2 class="text-xl font-bold mb-4" style="font-family:'Plus Jakarta Sans'">More in ${sn}</h2><div id="rel" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div></section>`;
document.getElementById('dl').onclick=()=>{if(!v.video_url)return esToast('Download works once the video file is in Supabase');const a=document.createElement('a');a.href=v.video_url;a.download='';a.target='_blank';a.click()};
document.getElementById('share').onclick=()=>{navigator.clipboard?.writeText(location.href);esToast('Link copied')};
let rel=(await ES.listVideos({category:v.category})).filter(x=>x.id!==v.id);rel.sort((a,b)=>(b.subcategory===v.subcategory)-(a.subcategory===v.subcategory));
const r=document.getElementById('rel');r.innerHTML=rel.slice(0,3).map(esCard).join('');esHoverPlay(r);})();
</script></body></html>
